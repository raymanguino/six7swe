packages:
  - frontend
  - backend
  - packages

# Keep this list to overrides that change the resolved tree. A security bump for
# a transitive dependency only needs an override while the lockfile pins the
# vulnerable version; once the lockfile has moved forward, a fresh resolution
# picks the patched release on its own and the override is dead weight. Check
# with `pnpm install --lockfile-only` with and without the entry, and drop it
# when nothing changes.
overrides:
  # cookie 2 is ESM only. light-my-request still requires it from CommonJS,
  # which Node resolves through `require(esm)` but Jest cannot parse. The
  # 1.x line has the same `stringifySetCookie` export and is CommonJS.
  'light-my-request>cookie': ^1.1.1

  # content-disposition 3.x is ESM only. @fastify/static is CommonJS and does
  # `require('content-disposition')`. This was added when production ran
  # Node 18, where that throws ERR_REQUIRE_ESM. The Node floor is now 22.12,
  # which loads 3.x through `require(esm)`, and Jest never loads
  # @fastify/static, so the pin is no longer required. It stays because the
  # 2.x line is CommonJS and produces byte-identical headers; dropping it is
  # a separate change to what production runs.
  '@fastify/static>content-disposition': 2.0.1
