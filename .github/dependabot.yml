version: 2

updates:
  # pnpm is handled by the `npm` ecosystem: Dependabot reads the pnpm
  # lockfile and the pnpm workspace to find the manifests to update.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: America/Bogota
    versioning-strategy: increase-if-necessary
    # Dependabot opens a separate pull request per group, and it will happily
    # exceed a limit of five.
    open-pull-requests-limit: 10
    groups:
      typescript-tooling:
        patterns:
          - typescript
          - '@typescript-eslint/*'
      linting:
        patterns:
          - eslint
          - '@eslint/*'
          - eslint-plugin-*
      fastify:
        patterns:
          - fastify
          - '@fastify/*'
          - fastify-plugin
      react:
        patterns:
          - react
          - react-dom
          - react-router-dom
          - '@types/react'
          - '@types/react-dom'
      drizzle:
        patterns:
          - drizzle-orm
          - drizzle-kit
      testing:
        patterns:
          - jest
          - ts-jest
          - '@types/jest'
          - supertest
          - '@types/supertest'
    ignore:
      # Ships its own types; the stub package only shadows them.
      - dependency-name: '@types/puppeteer'
      # Major upgrades are deliberate, not automatic. Each of these has a
      # known blocker, so Dependabot proposes the minor and patch upgrades
      # and the majors are raised by hand.
      #
      # typescript 7: typescript-eslint does not support the TS 7 API yet and
      #   fails to load. See typescript-eslint issue 10940.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      # zod 4: v4 removed `z.ZodTypeDef` and reordered the generics on
      #   `z.ZodType`. `structuredCompletion` needs its signature updated
      #   before the upgrade can land.
      - dependency-name: zod
        update-types:
          - version-update:semver-major
      # vite 6: wants a matching @vitejs/plugin-react major.
      - dependency-name: vite
        update-types:
          - version-update:semver-major
      # The fastify plugins move to new majors together with fastify itself.
      - dependency-name: fastify-plugin
        update-types:
          - version-update:semver-major
      - dependency-name: '@fastify/static'
        update-types:
          - version-update:semver-major
      - dependency-name: '@fastify/request-context'
        update-types:
          - version-update:semver-major

  # Keep the base image tag in backend/Dockerfile current.
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: America/Bogota
    ignore:
      # Stay on Node 22: `engines.node` in the root package.json is `>=22.12 <23`,
      # and CI tests on 22. Moving to a new major is a deliberate change to both.
      - dependency-name: node
        update-types:
          - version-update:semver-major

  # Keep the action versions in .github/workflows current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: America/Bogota
    groups:
      actions:
        patterns:
          - '*'
