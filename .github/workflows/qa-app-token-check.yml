# Throwaway verification for the QA agent's GitHub App credential.
#
# Part of the QA agent plan -- see issue #52, step A7.
#
# This workflow mints an installation access token and proves that it can act
# on the repository. It exists so the credential is validated BEFORE anything
# depends on it, and it deletes itself once it has done its job.
#
# It is triggered manually only. It never runs on a pull request.
#
# DELETE THIS FILE once the verification passes and the real
# `.github/workflows/qa-review.yml` exists (issue #57).

name: QA app token check

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: qa-app-token-check
  cancel-in-progress: false

jobs:
  verify:
    name: Verify the app token
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.QA_APP_CLIENT_ID }}
          private-key: ${{ secrets.QA_APP_PRIVATE_KEY }}
          permission-pull-requests: write

      - name: Show what was minted
        run: |
          echo "app slug:     ${{ steps.app-token.outputs.app-slug }}"
          echo "installation: ${{ steps.app-token.outputs.installation-id }}"

      # `GET /installation/repositories` is the endpoint that accepts an
      # installation access token. `GET /app` does NOT: that one needs the app
      # JWT, which the action does not expose.
      - name: List repositories the installation can reach
        run: |
          gh api /installation/repositories --jq '.repositories[].full_name'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Check the pull request permission on six7swe
        run: |
          gh api /installation/repositories \
            --jq '.repositories[] | select(.full_name == "raymanguino/six7swe") | .permissions'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      # The real question: can the token actually act on pull requests? Read
      # them rather than writing anything.
      - name: Confirm the token can read pull requests
        run: |
          gh api "repos/raymanguino/six7swe/pulls?state=open&per_page=5" \
            --jq 'length as $n | "open pull requests visible: \($n)"'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
