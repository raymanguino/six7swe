name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          # The version comes from the `packageManager` field in the root
          # package.json, so there is a single source of truth.
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # CI never applies the Railway config; this only catches a file that would fail to plan.
      - name: Type-check Railway config
        run: pnpm exec tsc -p tsconfig.railway.json

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
